# Garage — triển khai độc lập, Coolify project riêng
#
# Coolify setup:
#   1. New Project → Docker Compose → chọn file này
#   2. Set env var: GARAGE_RPC_SECRET=$(openssl rand -hex 32)
#   3. Expose port 3900 → domain: s3.your-domain.com
#
# Sau lần deploy đầu tiên:
#   docker compose -f docker-compose.garage.yaml exec garage sh /scripts/garage-init.sh
#
# Điền vào server/.env của app:
#   GARAGE_ENDPOINT=https://s3.your-domain.com
#   GARAGE_PUBLIC_URL=https://s3.your-domain.com/giapha
#   GARAGE_KEY_ID=GK...
#   GARAGE_SECRET_KEY=...
#   GARAGE_BUCKET=giapha

services:
  garage:
    image: dxflrs/garage:v1.3.1
    environment:
      # Garage v1.3 đọc env var này và override rpc_secret trong file config.
      # Set giá trị thực trong Coolify: openssl rand -hex 32
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?Set GARAGE_RPC_SECRET in Coolify env vars}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - ./scripts/garage-init.sh:/scripts/garage-init.sh:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    ports:
      - "3900:3900"   # S3 API — expose ra s3.your-domain.com
      - "3902:3902"   # Web endpoint (tuỳ chọn)
      - "3903:3903"   # Admin
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3903/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  garage_meta:
  garage_data:
