services:

  # ── Nginx: phục vụ React SPA + reverse proxy ──────────────────────────────
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.client
      args:
        # Để trống → OAuth dùng URL tương đối qua nginx proxy.
        # Ghi đè nếu cần: VITE_SERVER_URL: https://your-domain.com
        VITE_SERVER_URL: ""
    depends_on:
      - server
    restart: unless-stopped
    networks:
      - app
    healthcheck:
      # nginx:alpine có sẵn wget (busybox); dùng 127.0.0.1 vì localhost
      # phân giải ra ::1 (IPv6) mà nginx chỉ listen IPv4
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── Server: Node.js API ───────────────────────────────────────────────────
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # Ưu tiên IPv4 khi gọi ra ngoài (OAuth token exchange với Google/Facebook)
      # — tránh treo khi VPS không route được IPv6
      NODE_OPTIONS: --dns-result-order=ipv4first
    volumes:
      - server_data:/app/data        # SQLite database
      - server_uploads:/app/uploads  # Local fallback (khi Garage chưa cấu hình)
    restart: unless-stopped
    networks:
      - app
    healthcheck:
      # node:22-slim không có wget/curl → dùng fetch của Node
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5109/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  server_data:
  server_uploads:

networks:
  app:
    driver: bridge
