server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Tăng giới hạn upload để match server (20 MB ảnh + overhead)
    client_max_body_size 25m;

    # ── API (Express) ────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://server:5109;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Ảnh local (JWT-protected, serve qua server) ──────────────────────────
    location /uploads/ {
        proxy_pass         http://server:5109;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # ── Socket.IO (WebSocket) ────────────────────────────────────────────────
    location /socket.io/ {
        proxy_pass         http://server:5109;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 86400s;
    }

    # ── Static files (React SPA) ─────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets có hash trong tên → cache vĩnh viễn
    location ~* \.(?:js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html không cache (PWA cần re-check)
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
